system:
  seed: 42
  device: "cuda"
  num_workers: 8

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  csv_path: "data/interim/train_ready_dataset.csv"  
  encoders_path: "data/processed/label_encoders.pkl"
  image_size: [224, 224]
  
model:
  backbone: "resnet50"
  pretrained: true
  heads:
    category: 148
    color: 21
    fabric: 40
    style: 80

training:
  batch_size: 32
  epochs: 50
  learning_rate: 1.0e-04
  weight_decay: 1.0e-05
