system:
  seed: 42
  device: "cuda"
  num_workers: 4

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_size: [224, 224]

model:
  backbone: "resnet50"
  pretrained: true
  heads:
    category: 15
    color: 12
    fabric: 8
    style: 4

training:
  batch_size: 32
  epochs: 50
  learning_rate: 1.0e-04
  weight_decay: 1.0e-05
